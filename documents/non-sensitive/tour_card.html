<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground,#f9fafb)] antialiased p-2">
  <div class="bg-[var(--card,#111827)] text-[var(--foreground,#f9fafb)] border border-[var(--border,#1f2937)] rounded-xl p-4 shadow-lg max-w-xl mx-auto space-y-3">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[var(--border,#1f2937)] pb-2.5">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛡️</span>
        <div>
          <h2 class="text-sm font-bold text-white">ClassiGuard CyFence &bull; Interactive Tour</h2>
          <p class="text-[11px] text-[var(--muted-foreground,#9ca3af)]">Zero-Dependency Defensive Posture & Compliance Engine</p>
        </div>
      </div>
      <span id="slideIndicator" class="px-2 py-0.5 rounded text-[11px] font-mono bg-blue-500/20 text-blue-400 border border-blue-500/30">1 of 6</span>
    </div>

    <!-- Active Slide Content Area (Fixed Height to avoid overflow) -->
    <div id="slideContainer" class="h-48 overflow-y-auto pr-1">
      <!-- Injected dynamically via JS -->
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between pt-2 border-t border-[var(--border,#1f2937)]">
      <button onclick="prevSlide()" class="px-3 py-1 rounded bg-[var(--background,#0b0f19)] hover:bg-gray-800 text-xs font-semibold border border-[var(--border,#1f2937)] text-gray-300">
        ← Prev
      </button>

      <div class="flex gap-1" id="dotsContainer">
        <!-- Dots injected -->
      </div>

      <button onclick="nextSlide()" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-sm">
        Next →
      </button>
    </div>
  </div>

  <script>
    const slides = [
      {
        badge: '1. Architecture & Ethos',
        icon: '📦',
        title: 'Zero Dependencies & Air-Gapped Ready',
        desc: 'Built in 100% pure Node.js standard libraries. Ships as a single self-contained standalone binary (cyfence.exe / Linux tarball) with zero external network phone-homes.',
        pills: ['Zero npm bloat', 'Air-Gapped safe', 'Windows & Linux', 'Node SEA runtime']
      },
      {
        badge: '2. Audit Engine',
        icon: '🔍',
        title: 'OWASP ASVS v4.0 Compliance',
        desc: 'Verifies HSTS, Content-Security-Policy, secure cookies (Secure/HttpOnly/SameSite), CORS wildcard reflection, and JWT RFC 8725 compliance (rejects alg:none).',
        pills: ['ASVS Score (0-100)', 'Letter Grades A-F', 'ATT&CK Mapped', 'D3FEND Countermeasures']
      },
      {
        badge: '3. Red Team Recon',
        icon: '🎯',
        title: 'Perimeter & Route Discovery',
        desc: 'Passively fingerprints perimeter WAFs/CDNs (Cloudflare, AWS CloudFront, Akamai). Audits exposed routes (/.git, /.env, /actuator) and verifies RFC 9116 security.txt.',
        pills: ['WAF Detection', 'Sensitive Probes', 'HTTP TRACE check', 'RFC 9116 security.txt']
      },
      {
        badge: '4. Blue Team Defense',
        icon: '🛡️',
        title: 'Auto-Remediation & SIEM Rules',
        desc: 'Converts defects immediately into copy-paste Nginx and Apache hardening snippets, generates Sigma SIEM detection rules, and computes drift diffs between audit cycles.',
        pills: ['Nginx / Apache Configs', 'Sigma Detection YAML', 'Elasticsearch DSL', 'Drift Diff Engine']
      },
      {
        badge: '5. AI Advisor',
        icon: '🤖',
        title: 'Mandatory Human Approval',
        desc: 'Connects to Ollama (offline local Llama 3), Claude, or OpenAI to synthesize remediation plans. Strict architectural rule: zero autonomous decisions; human approval mandatory.',
        pills: ['Ollama Local / Offline', 'Claude / OpenAI API', 'Prompt Sanitized', 'Human Audit Trail']
      },
      {
        badge: '6. Scale & VAPT',
        icon: '⚡',
        title: '50,000 Machines in 388ms & Hardened',
        desc: 'Audited across 50k synthetic enterprise nodes in 388ms (~128k nodes/sec, 0 leaks). Hardened against SSRF, DOM XSS, Heap OOM, local CSRF, and 0.0.0.0 binding.',
        pills: ['128k nodes/sec', 'Zero Memory Leak', 'SSRF Guard', 'Anti-CSRF Nonce']
      }
    ];

    let current = 0;

    function renderSlide(idx) {
      current = idx;
      const s = slides[idx];
      document.getElementById('slideIndicator').innerText = `${idx + 1} of ${slides.length}`;

      const container = document.getElementById('slideContainer');
      container.innerHTML = `
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="text-xl">${s.icon}</span>
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400 block">${s.badge}</span>
              <h3 class="text-xs font-semibold text-white">${s.title}</h3>
            </div>
          </div>
          <p class="text-xs text-[var(--muted-foreground,#9ca3af)] leading-relaxed">${s.desc}</p>
          <div class="flex flex-wrap gap-1.5 pt-1">
            ${s.pills.map(p => `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-[var(--background,#0b0f19)] text-cyan-300 border border-[var(--border,#1f2937)]">${p}</span>`).join('')}
          </div>
        </div>
      `;

      // Render dots
      const dots = document.getElementById('dotsContainer');
      dots.innerHTML = slides.map((_, i) => `
        <button onclick="renderSlide(${i})" class="w-2 h-2 rounded-full transition-all ${i === current ? 'bg-blue-500 w-4' : 'bg-gray-600'}"></button>
      `).join('');
    }

    function nextSlide() {
      renderSlide((current + 1) % slides.length);
    }

    function prevSlide() {
      renderSlide((current - 1 + slides.length) % slides.length);
    }

    document.addEventListener('DOMContentLoaded', () => renderSlide(0));
  </script>
</body>
</html>
